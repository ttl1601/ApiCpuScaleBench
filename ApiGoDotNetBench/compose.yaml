name: api-go-dotnet-bench
services:
  dotnet:
    build: ./dotnet
    cpus: 1
    mem_limit: 1g
    ports: ["127.0.0.1:18082:8080"]
  go:
    build: ./go
    cpus: 1
    mem_limit: 1g
    environment:
      GOMAXPROCS: "1"
    ports: ["127.0.0.1:18083:8080"]
  loadgen:
    build: ./loadgen
    profiles: ["tools"]
    cpus: 4
    mem_limit: 2g
    volumes: ["./results:/results", "./payloads:/payloads:ro"]
    command: ["run", "--ccu", "100,1000,5000", "--seconds", "20", "--warmup", "5", "--repetitions", "3"]
