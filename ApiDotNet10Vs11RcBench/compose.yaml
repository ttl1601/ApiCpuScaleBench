name: api-dotnet10-vs11rc-bench
services:
  dotnet10:
    build: ./dotnet10
    cpus: 1
    mem_limit: 1g
    ports: ["127.0.0.1:18088:8080"]
    volumes: ["./monitor.sh:/monitor.sh:ro"]
  dotnet11:
    build: ./dotnet11
    cpus: 1
    mem_limit: 1g
    ports: ["127.0.0.1:18089:8080"]
    volumes: ["./monitor.sh:/monitor.sh:ro"]
  loadgen:
    build: ./loadgen
    profiles: ["tools"]
    cpus: 4
    mem_limit: 2g
    volumes: ["./results:/results", "./payloads:/payloads:ro"]
